services:
  design-system:
    build: { context: ., dockerfile: Dockerfile.dev }
    container_name: civikstack-design-system
    ports: ["3300:3000"]
    environment:
      - NODE_ENV=development
      - SITE_ROOT=/site
      - WATCHPACK_POLLING=true
      - DATABASE_URI=file:/data/wayfinder.db
      - PAYLOAD_SECRET=wayfinder-local-dev-secret-0813
    volumes:
      # This project — hot reload.
      - .:/app
      # The real site, READ-ONLY. The catalogue reads component source from here
      # and can never modify it.
      - "/Users/reggie/Civkstack Foundation Website:/site:ro"
      # Container-owned so the host is never touched.
      - ds_node_modules:/app/node_modules
      - ds_next:/app/.next
      # Catalogue content — survives container rebuilds, like the site's volume.
      - ds_db:/data

volumes:
  ds_node_modules:
  ds_next:
  ds_db:
